  <body>
    <div id="container"></div>
  
    <div id="info">
      <strong><a href="http://www.chromeexperiments.com/globe">WebGL Globe</a></strong> <span class="bull">&bull;</span> Created by the Google Data Arts Team <span class="bull">&bull;</span> Adapted for audience data visualization
    </div>
  
    <div id="currentInfo">
      <span id="year1990" class="year">2023</span>
      <span id="year1995" class="year">2024</span>

    <!-- Modify the companies container div -->
    <div id="companiesInfo">
      <div class="control-buttons">
        <button class="control-button" id="selectAll">Select All</button>

    <div id="title">

    <script type="text/javascript" src="third-party/Detector.js"></script>

   <script type="text/javascript">
  if(!Detector.webgl){
    Detector.addGetWebGLMessage();
  } else {
    var years = ['1990','1995','2000'];
    var container = document.getElementById('container');
    var globe = new DAT.Globe(container);
    
    // Add companies list
    var companies = [
      'Brainly', 'Codecademy', 'Delivery Hero', 'Despegar', 'Despegar AR',
      'Despegar CL', 'Despegar CO', 'Despegar MX', 'Despegar PE', 'Edume',
      'Emeritus', 'Eruditus', 'Flink', 'Foodics', 'GoStudent', 'GoodHabitz',
      'JE Takeaway', 'Media24', 'OLX', 'OLX ', 'OLX Real Estate', 'Oda',
      'Otodom (OLX)', 'Otomoto (OLX)', 'Platzi', 'Sharebite', 'SkillSoft',
      'SoloLearn', 'Stack Overflow', 'Standvirtual', 'Swiggy', 'TakeAlot Group',
      'Takealot', 'Udemy', 'eMAG', 'iFood'
    ];
    
    // Add company brand colors
    var companyColors = {
      'Brainly': '#00B37E',
      'Codecademy': '#6A4CFF',
      'Delivery Hero': '#F8A800',
      'Despegar': '#00ADEF',
      'Despegar AR': '#00ADEF',
      'Despegar CL': '#00ADEF',
      'Despegar CO': '#00ADEF',
      'Despegar MX': '#00ADEF',
      'Despegar PE': '#00ADEF',
      'Edume': '#1E88E5',
      'Emeritus': '#FF6F61',
      'Eruditus': '#FF6F61',
      'Flink': '#00C853',
      'Foodics': '#F8A800',
      'GoStudent': '#FF6F61',
      'GoodHabitz': '#F9A825',
      'JE Takeaway': '#FF6F61',
      'Media24': '#00ADEF',
      'OLX': '#FF7A00',
      'OLX ': '#FF7A00',
      'OLX Real Estate': '#FF7A00',
      'Oda': '#FF6F61',
      'Otodom (OLX)': '#FF7A00',
      'Otomoto (OLX)': '#FF7A00',
      'Platzi': '#00ADEF',
      'Sharebite': '#00ADEF',
      'SkillSoft': '#00ADEF',
      'SoloLearn': '#FF6F61',
      'Stack Overflow': '#F8A800',
      'Standvirtual': '#00ADEF',
      'Swiggy': '#FF6F61',
      'TakeAlot Group': '#00ADEF',
      'Takealot': '#00ADEF',
      'Udemy': '#EC1C24',
      'eMAG': '#FF6F61',
      'iFood': '#F8A800'
    };
    
    var companiesContainer = document.querySelector('.companies-container');
    
    // Store selected companies
    var selectedCompanies = new Set();
    
    // Generate elements for each company
    companies.forEach(function(company, index) {
      var companyElem = document.createElement('span');
      companyElem.id = 'company' + index;
      companyElem.className = 'company';
      companyElem.textContent = company;
      companyElem.setAttribute('data-company', company);
      companiesContainer.appendChild(companyElem);
    });

    var i, tweens = [];
    
    var settime = function(globe, t) {
      return function() {
        new TWEEN.Tween(globe).to({time: t/years.length},500).easing(TWEEN.Easing.Cubic.EaseOut).start();
        var y = document.getElementById('year'+years[t]);
        if (y.getAttribute('class') === 'year active') {
          return;
        }
        var yy = document.getElementsByClassName('year');
        for(i=0; i<yy.length; i++) {
          yy[i].setAttribute('class','year');
        }
        y.setAttribute('class', 'year active');
      };
    };

    // Helper method to stack a single bar with an offset
   // Helper method to stack a single bar with an offset
function stackBarWithOffset(lat, lng, magnitude, selectionOffset, color, combinedData, combinedColors, pointToCompanyMap, companyName) {
  const BASE_HEIGHT = 0.1; // Base height from globe surface
  const BAR_SPACING = 0.5; // Space between bars

  // Start point - begins at BASE_HEIGHT plus the selection offset
  combinedData.push(lat, lng, BASE_HEIGHT + (selectionOffset * BAR_SPACING));
  pointToCompanyMap.push(companyName);
  combinedColors.push(color.r, color.g, color.b, color.a);

  // End point - adds the magnitude to the starting point
  combinedData.push(lat, lng, BASE_HEIGHT + (selectionOffset * BAR_SPACING) + magnitude);
  pointToCompanyMap.push(companyName);
  combinedColors.push(color.r, color.g, color.b, color.a);
}

function updateGlobeVisualization() {
  // Properly clean up existing points and segments
  if (globe.points) {
    globe.scene.remove(globe.points);
    globe._baseGeometry = undefined;
  }

  if (selectedCompanies.size === 0) {
    document.getElementById('title').textContent = 'Audience Geo Data';
    globe.createPoints();
    return;
  }

  var combinedData = [];
  var combinedColors = [];
  var pointToCompanyMap = [];

  // Track height at each location
  const locationHeightMap = new Map();
  const BASE_HEIGHT = 0.1; // Base height from globe surface
  const SPACING = 0.05; // Small gap between consecutive bars

  // Convert Set to Array to maintain selection order
  const selectedCompaniesArray = Array.from(selectedCompanies);

  // For each selected company, build bars with stacked offsets
  selectedCompaniesArray.forEach(function(index) {
    var data = window.data[index][1];
    var companyName = companies[index];
    
    for (var i = 0; i < data.length; i += 3) {
      var lat = data[i];
      var lng = data[i + 1];
      var magnitude = data[i + 2];

      // Create unique location key
      const locationKey = `${lat.toFixed(4)},${lng.toFixed(4)}`;
      
      // Get current height at this location (or BASE_HEIGHT if first bar)
      let startHeight = locationHeightMap.get(locationKey) || BASE_HEIGHT;
      
      // Company color
      var hexColor = companyColors[companyName] || '#FFFFFF';
      var r = parseInt(hexColor.substring(1, 3), 16) / 255;
      var g = parseInt(hexColor.substring(3, 5), 16) / 255;
      var b = parseInt(hexColor.substring(5, 7), 16) / 255;
      var a = 1.0;
      var colorObj = { r, g, b, a };

      // Start point - begins at current height for this location
      combinedData.push(lat, lng, startHeight);
      pointToCompanyMap.push(companyName);
      combinedColors.push(colorObj.r, colorObj.g, colorObj.b, colorObj.a);

      // End point
      combinedData.push(lat, lng, startHeight + magnitude);
      pointToCompanyMap.push(companyName);
      combinedColors.push(colorObj.r, colorObj.g, colorObj.b, colorObj.a);

      // Update height map for this location
      locationHeightMap.set(locationKey, startHeight + magnitude + SPACING);
    }
  });

  globe.addData(combinedData, {
    format: 'magnitude', 
    animated: false,
    colors: combinedColors,
    pointToCompanyMap: pointToCompanyMap,
    companyColors: companyColors,
    segmentPairs: true,
    transparent: true,
    stackedBars: true
  });

  globe.createPoints();

  // Update UI title
  var selectedNames = Array.from(selectedCompanies)
    .map(index => companies[index])
    .join(', ');

  new TWEEN.Tween(globe).to({time: 0},500).easing(TWEEN.Easing.Cubic.EaseOut).start();
}












    // Set company selection
    var setcompany = function(globe, t) {
      return function() {
        var c = document.getElementById('company'+t);
        var companyName = c.getAttribute('data-company');
        var brandColor = companyColors[companyName];
        
        if (c.getAttribute('class') === 'company active') {
          c.setAttribute('class', 'company');
          c.style.backgroundColor = '';
          selectedCompanies.delete(t);
        } else {
          c.setAttribute('class', 'company active');
          c.style.backgroundColor = brandColor;
          selectedCompanies.add(t);
        }
    
        updateGlobeVisualization();
      };
    };

    document.getElementById('selectAll').addEventListener('click', function() {
      companies.forEach(function(company, index) {
        var c = document.getElementById('company'+index);
        c.setAttribute('class', 'company active');
        c.style.backgroundColor = companyColors[company];
        selectedCompanies.add(index);
      });
      updateGlobeVisualization();
    });

    document.getElementById('selectNone').addEventListener('click', function() {
      companies.forEach(function(_, index) {
        var c = document.getElementById('company'+index);
        c.setAttribute('class', 'company');
        c.style.backgroundColor = '';
      });
      selectedCompanies.clear();
      updateGlobeVisualization();
    });

    for(var i = 0; i<years.length; i++) {
      var y = document.getElementById('year'+years[i]);
      y.addEventListener('mouseover', settime(globe,i), false);
    }
    
    for(var i = 0; i<companies.length; i++) {
      var c = document.getElementById('company'+i);
      c.addEventListener('click', setcompany(globe,i), false);
    }
    
    var xhr;
    TWEEN.start();
    
    xhr = new XMLHttpRequest();
    xhr.open('GET', 'audience_geo_data_compact.json', true);

    xhr.onreadystatechange = function(e) {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          
          var transformedData = data.map(function(companyEntry) {
            var companyName = companyEntry[0];
            var originalValues = [...companyEntry[1]];
            
            var maxMagnitude = 0;
            for (var i = 0; i < originalValues.length; i += 3) {
              maxMagnitude = Math.max(maxMagnitude, originalValues[i + 2]);
            }
            
            var newValues = [];
            for (var i = 0; i < originalValues.length; i += 3) {
              var lat = originalValues[i];
              var lng = originalValues[i + 1];
              var magnitude = originalValues[i + 2];
              
              // Scale magnitude for height
              var heightMagnitude = 0.1 + (magnitude / maxMagnitude) * 0.4;
              newValues.push(lat, lng, heightMagnitude);
            }
            
            return [companyName, newValues];
          });
          
          window.data = transformedData;
          
          globe.createPoints();
          globe.animate();
          document.body.style.backgroundImage = 'none';
        }
      }
    };
    xhr.send(null);
  }
</script>
